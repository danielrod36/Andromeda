name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format --check
        run: uv run ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python = ">=3.12"; exercise the full supported range.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run full test suite
        run: uv run pytest tests/ -v

  client:
    name: Client (gdlint + gdformat + gdUnit4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: tools/godot
          key: godot-4.7.1-stable-linux-x86_64
      - name: Download Godot (skip on cache hit)
        run: tools/get_godot.sh
      - name: Install xvfb (golden screenshots need a real renderer)
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Client lint
        run: tools/run_client_lint.sh
      - name: Client tests
        run: xvfb-run -a tools/run_client_tests.sh
