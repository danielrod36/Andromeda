<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>ANDROMEDA — UI Deck (final)</title>
<style>
  :root { --bg:#07090F; --panel:#0c0f16; --line:#232a3a; --ink:#E9EDF5; --muted:#7E8899; --accent:#8FA3C8; --ok:#5FC98E; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Chakra Petch", sans-serif; overflow:hidden; }
  #chrome { display:grid; grid-template-columns: 250px 1fr; height:100vh; }
  #rail { background:var(--panel); border-right:2px solid var(--line); padding:16px 14px; overflow-y:auto; }
  #rail h1 { font:700 16px/1.2 "Space Grotesk",sans-serif; letter-spacing:.1em; margin:0 0 2px; }
  #rail .sub { font:400 11px/1 "VT323",monospace; letter-spacing:.18em; color:var(--accent); margin-bottom:14px; }
  .nav { display:block; width:100%; text-align:left; background:none; border:2px solid transparent; color:var(--muted);
         font:600 12px/1.3 "Chakra Petch",sans-serif; padding:8px 10px; cursor:pointer; }
  .nav:hover { border-color:var(--line); color:var(--ink); }
  .nav.on { border-color:var(--accent); color:var(--ink); background:rgba(143,163,200,.08); }
  .nav .num { font:500 10px/1 "IBM Plex Mono",monospace; color:var(--accent); margin-right:8px; }
  #stage { display:flex; flex-direction:column; }
  #bar { display:flex; align-items:center; gap:14px; padding:8px 14px; border-bottom:2px solid var(--line); background:var(--panel); }
  #bar .t { font:600 13px/1 "Chakra Petch",sans-serif; letter-spacing:.06em; }
  #bar .hint { font:400 11px/1 "VT323",monospace; letter-spacing:.1em; color:var(--muted); margin-left:auto; }
  #bar button { background:var(--panel); border:2px solid var(--line); color:var(--ink); font:600 11px/1 "Chakra Petch",sans-serif; padding:6px 12px; cursor:pointer; }
  #bar button:hover { border-color:var(--accent); }
  #view { flex:1; background:#07090F; }
  iframe { width:100%; height:100%; border:0; }
</style></head>
<body>
<div id="chrome">
  <div id="rail">
    <h1>ANDROMEDA</h1><div class="sub">UI DECK · FINAL</div>
    <div id="navs"></div>
  </div>
  <div id="stage">
    <div id="bar">
      <button onclick="go(cur-1)">◀ PREV</button>
      <span class="t" id="cap">—</span>
      <button onclick="go(cur+1)">NEXT ▶</button>
      <span class="hint">← → NAVIGATE · EACH SCREEN IS A STANDALONE FILE IN final/</span>
    </div>
    <div id="view"><iframe id="fr" src=""></iframe></div>
  </div>
</div>
<script>
const slides = [
  ["00", "Cover & design system", null],
  ["01", "Title — console boot", "final/01-title.html"],
  ["02", "Chronicles — saves", "final/02-chronicles.html"],
  ["03", "New Journey — manifest", "final/03-new-journey.html"],
  ["04", "The Ceremony", "final/04-ceremony.html"],
  ["05", "Settings", "final/05-settings.html"],
  ["06", "Chargen shell + story rail", "final/06-chargen-shell.html"],
  ["07", "Chargen beats — careers/aging/crisis/muster", "final/07-chargen-beats.html"],
  ["08", "Character reveal", "final/08-character-reveal.html"],
  ["09", "Adventure shell + hook + free-text", "final/09-adventure.html"],
  ["10", "Defeat & memorial", "final/10-defeat-memorial.html"],
  ["11", "Overlays", "final/11-overlays.html"],
  ["12", "Components — roll readout & tokens", "final/12-components.html"],
];
let cur = 0;
const navs = document.getElementById('navs');
slides.forEach((s, i) => {
  const b = document.createElement('button');
  b.className = 'nav'; b.innerHTML = `<span class="num">${s[0]}</span>${s[1]}`;
  b.onclick = () => go(i); navs.appendChild(b);
});
function cover() {
  return 'data:text/html,' + encodeURIComponent(`<body style="background:#07090F;color:#E9EDF5;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
  <div style="text-align:center; max-width:70ch;">
    <div style="font:700 44px/1 'Space Grotesk',sans-serif; letter-spacing:.16em;">ANDROMEDA</div>
    <div style="font:400 13px/1 'VT323',monospace; letter-spacing:.3em; color:#8FA3C8; margin-top:10px;">WRITTEN IN THE STARS — UI DECK</div>
    <div style="font:400 15px/1.8 Atkinson Hyperlegible,sans-serif; color:#98a2b8; margin-top:26px;">Hi-bit Console design language · Godot 4.7 client over the Python engine sidecar<br>
    12 screens + component reference · every screen a standalone file in <span style="font-family:monospace">final/</span></div>
  </div></body>`);
}
function go(i) {
  cur = Math.max(0, Math.min(slides.length - 1, i));
  const [num, title, src] = slides[cur];
  document.getElementById('cap').textContent = `${num} · ${title}`;
  document.getElementById('fr').src = src || cover();
  [...navs.children].forEach((b, j) => b.classList.toggle('on', j === cur));
}
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(cur + 1);
  if (e.key === 'ArrowLeft') go(cur - 1);
});
go(0);
</script>
</body></html>
