[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cepheus-adventure"
version = "0.1.0"
description = "A deterministic-rules CYOA RPG where the engine owns mechanics and the LLM only narrates."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-ai>=0.0.1",
    "textual>=0.80",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pytest.ini_options.markers]
slow = "marks tests as slow"
