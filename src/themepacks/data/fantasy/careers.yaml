# Fantasy Careers — 10 original careers with full table data.
# Each career has qualification, survival, advancement, three skill tables
# (Personal Development, Service Skills, Advanced Education), optional ranks,
# and mustering-out benefit tables (cash and material).
# All skill results reference skill ids from skills.yaml or characteristic
# increases (+1 STR).

knight:
  id: knight
  name: "Knight"
  description: >
    Noble warriors sworn to defend the realm. Knights train from youth in the
    arts of sword, shield, and horsemanship. They are bound by codes of honour
    and serve as the martial arm of kings and lords. Knights excel in mounted
    combat, leadership, and courtly diplomacy.
  qualification:
    characteristic: STR
    target: 5
  survival:
    characteristic: END
    target: 5
  advancement:
    characteristic: EDU
    target: 7
  skill_tables:
    - name: "Personal Development"
      entries:
        num_dice: 2
        die_size: 6
        entries:
          - {min: 2, max: 3, result: "+1 STR"}
          - {min: 4, max: 5, result: "+1 DEX"}
          - {min: 6, max: 6, result: "+1 END"}
          - {min: 7, max: 7, result: "+1 INT"}
          - {min: 8, max: 9, result: "+1 EDU"}
          - {min: 10, max: 12, result: "leadership"}
    - name: "Service Skills"
      entries:
        num_dice: 2
        die_size: 6
        entries:
          - {min: 2, max: 2, result: "sword"}
          - {min: 3, max: 3, result: "shield"}
          - {min: 4, max: 5, result: "ride"}
          - {min: 6, max: 6, result: "polearm"}
          - {min: 7, max: 7, result: "intimidation"}
          - {min: 8, max: 9, result: "tactics"}
          - {min: 10, max: 11, result: "etiquette"}
          - {min: 12, max: 12, result: "athletics"}
    - name: "Advanced Education"
      entries:
        num_dice: 2
        die_size: 6
        entries:
          - {min: 2, max: 3, result: "leadership"}
          - {min: 4, max: 5, result: "tactics"}
          - {min: 6, max: 7, result: "etiquette"}
          - {min: 8, max: 9, result: "history"}
          - {min: 10, max: 11, result: "religion"}
          - {min: 12, max: 12, result: "persuasion"}
  ranks:
    - {rank: 1, title: "Squire"}
    - {rank: 2, title: "Knight"}
    - {rank: 3, title: "Captain"}
    - {rank: 4, title: "Baron"}
    - {rank: 5, title: "Count"}
    - {rank: 6, title: "Duke"}
  mustering_out_cash:
    name: "Cash Benefits"
    dm_per_term: 1
    dm_per_rank: 1
    entries:
      num_dice: 1
      die_size: 6
      entries:
        - {min: 1, max: 1, result: "100 gold crowns"}
        - {min: 2, max: 2, result: "200 gold crowns"}
        - {min: 3, max: 3, result: "500 gold crowns"}
        - {min: 4, max: 4, result: "800 gold crowns"}
        - {min: 5, max: 5, result: "1,200 gold crowns"}
        - {min: 6, max: 6, result: "2,000 gold crowns"}
  mustering_out_material:
    name: "Material Benefits"
    entries:
      num_dice: 1
      die_size: 6
      entries:
        - {min: 1, max: 1, result: "Sword"}
        - {min: 2, max: 2, result: "Shield"}
        - {min: 3, max: 3, result: "Warhorse"}
        - {min: 4, max: 4, result: "Suit of Armour"}
        - {min: 5, max: 5, result: "Land Grant"}
        - {min: 6, max: 6, result: "Retainer"}

