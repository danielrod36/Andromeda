# Fantasy Skill Definitions
# Each skill has an id (snake_case), a human-readable name, an optional
# description, and an optional career association for referential integrity.
# Career associations must match a career id in careers.yaml.

# --- Combat Skills ---

sword:
  id: sword
  name: "Sword"
  description: "Fight with longswords, shortswords, and bladed sidearms."
  career: knight

bow:
  id: bow
  name: "Bow"
  description: "Use longbows, shortbows, and composite bows in combat."
  career: ranger

crossbow:
  id: crossbow
  name: "Crossbow"
  description: "Use crossbows and hand crossbows in combat."
  career: mercenary

shield:
  id: shield
  name: "Shield"
  description: "Use shields for defense and shield-bash attacks."
  career: knight

wrestling:
  id: wrestling
  name: "Wrestling"
  description: "Grappling, throws, and unarmed close-quarters combat."
  career: mercenary

polearm:
  id: polearm
  name: "Polearm"
  description: "Fight with spears, halberds, pikes, and glaives."
  career: knight

