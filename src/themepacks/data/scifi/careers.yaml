# Open Game Content (Cepheus Engine SRD-derived). Licensed under OGL 1.0a — see LICENSE.OGL.
# CE SRD Careers — 25 careers with full table data.
# Each career has qualification, survival, commission (hierarchy only), advancement
# (hierarchy only), four 1D6 skill tables (Personal Development, Service Skills,
# Specialist Skills, Advanced Education), optional ranks, and 7-row mustering-out
# benefit tables (cash and material). Row 7 reachable via rank DM (max_extension: 1).
# Mishap table is the universal CE SRD Survival Mishaps table (1D6).
# SRD-verified 2026-07-31 against orffen/cepheus-srd (OGL mirror) and
# cross-referenced with cepheus-srd.opengamingnetwork.com.
# Note: "army" uses SRD Surface System Defense data (Army = planetary army
# in the CE SRD). "surface_defense" is the same SRD career under its SRD name.
# Drifter uses SOC 2+ (auto-qualify) instead of the SRD's DEX 5+ to preserve
# the engine's universal-fallback behaviour (see comment in drifter block).

# SRD-verified 2026-07-31: qual INT 6+/surv INT 5+/comm SOC 7+/adv EDU 6+/reenlist 5+
navy:
  id: navy
  name: "Navy"
  description: >
    Member of an interstellar armed military force that conducts military operations in interplanetary or interstellar space. Also known as the "space navy".
  qualification:
    characteristic: INT
    target: 6
  survival:
    characteristic: INT
    target: 5
  commission:
    characteristic: SOC
    target: 7
  advancement:
    characteristic: EDU
    target: 6
  re_enlistment: 5
  mishap_table:
    num_dice: 1
    die_size: 6
    entries:
      - {min: 1, max: 1, result: "Injured in action. Roll on the Injury table."}
      - {min: 2, max: 2, result: "Honorably discharged from the service."}
      - {min: 3, max: 3, result: "Honorably discharged after a legal battle. Debt of Cr10,000.", effects: [{type: debt, amount: 10000}]}
      - {min: 4, max: 4, result: "Dishonorably discharged. Lose all benefits.", effects: [{type: lose_benefits}]}
      - {min: 5, max: 5, result: "Dishonorably discharged after prison. Lose all benefits.", effects: [{type: lose_benefits}]}
      - {min: 6, max: 6, result: "Medically discharged. Roll on the Injury table."}
  skill_tables:
    - name: "Personal Development"
      entries:
        num_dice: 1
        die_size: 6
        entries:
          - {min: 1, max: 1, result: "+1 STR"}
          - {min: 2, max: 2, result: "+1 DEX"}
          - {min: 3, max: 3, result: "+1 END"}
          - {min: 4, max: 4, result: "+1 INT"}
          - {min: 5, max: 5, result: "+1 EDU"}
          - {min: 6, max: 6, result: "cascade:melee"}
    - name: "Service Skills"
      entries:
        num_dice: 1
        die_size: 6
        entries:
          - {min: 1, max: 1, result: "cascade:electronics"}
          - {min: 2, max: 2, result: "engineer"}
          - {min: 3, max: 3, result: "cascade:gun_combat"}
          - {min: 4, max: 4, result: "gunnery_turrets"}
          - {min: 5, max: 5, result: "cascade:melee"}
          - {min: 6, max: 6, result: "cascade:drive"}
    - name: "Specialist Skills"
      entries:
        num_dice: 1
        die_size: 6
        entries:
          - {min: 1, max: 1, result: "gravitics"}
          - {min: 2, max: 2, result: "jack_of_trades"}
          - {min: 3, max: 3, result: "cascade:melee"}
          - {min: 4, max: 4, result: "astrogation"}
          - {min: 5, max: 5, result: "leadership"}
          - {min: 6, max: 6, result: "cascade:pilot"}
    - name: "Advanced Education"
      entries:
        num_dice: 1
        die_size: 6
        entries:
          - {min: 1, max: 1, result: "advocate"}
          - {min: 2, max: 2, result: "computers"}
          - {min: 3, max: 3, result: "engineer"}
          - {min: 4, max: 4, result: "medic"}
          - {min: 5, max: 5, result: "astrogation"}
          - {min: 6, max: 6, result: "cascade:tactics"}
  ranks:
    - {rank: 0, title: "Starman", bonus_skills: [{skill: vacc_suit, level: 1}]}
    - {rank: 1, title: "Midshipman"}
    - {rank: 2, title: "Lieutenant"}
    - {rank: 3, title: "Lieutenant Commander", bonus_skills: [{skill: cascade:tactics, level: 1}]}
    - {rank: 4, title: "Commander"}
    - {rank: 5, title: "Captain"}
    - {rank: 6, title: "Commodore"}
  mustering_out_cash:
    name: "Cash Benefits"
    entries:
      num_dice: 1
      die_size: 6
      max_extension: 1
      entries:
        - {min: 1, max: 1, result: "1,000 Cr"}
        - {min: 2, max: 2, result: "5,000 Cr"}
        - {min: 3, max: 3, result: "10,000 Cr"}
        - {min: 4, max: 4, result: "10,000 Cr"}
        - {min: 5, max: 5, result: "20,000 Cr"}
        - {min: 6, max: 6, result: "50,000 Cr"}
        - {min: 7, max: 7, result: "50,000 Cr"}
  mustering_out_material:
    name: "Material Benefits"
    entries:
      num_dice: 1
      die_size: 6
      max_extension: 1
      entries:
        - {min: 1, max: 1, result: "Low Passage"}
        - {min: 2, max: 2, result: "+1 EDU"}
        - {min: 3, max: 3, result: "Weapon", on_duplicate: "cascade:gun_combat"}
        - {min: 4, max: 4, result: "Mid Passage"}
        - {min: 5, max: 5, result: "+1 SOC"}
        - {min: 6, max: 6, result: "High Passage"}
        - {min: 7, max: 7, result: "Explorers' Society", once: true}

