# Open Game Content (Cepheus Engine SRD-derived). Licensed under OGL 1.0a — see LICENSE.OGL.
# CE SRD Starter Careers — 8 careers with full table data.
# Each career has qualification, survival, advancement, three skill tables
# (Personal Development, Service Skills, Advanced Education), optional ranks,
# and mustering-out benefit tables (cash and material).

navy:
  id: navy
  name: "Navy"
  description: >
    The interstellar Navy operates capital warships across the stars. Officers
    and crew serve in ship-to-ship combat, exploration patrols, and system
    defense. Navy characters are well-trained in technical skills and
    leadership.
  qualification:
    characteristic: INT
    target: 5
  survival:
    characteristic: END
    target: 5
  advancement:
    characteristic: EDU
    target: 7
  skill_tables:
    - name: "Personal Development"
      entries:
        num_dice: 2
        die_size: 6
        entries:
          - {min: 2, max: 3, result: "+1 STR"}
          - {min: 4, max: 5, result: "+1 DEX"}
          - {min: 6, max: 6, result: "+1 END"}
          - {min: 7, max: 7, result: "+1 INT"}
          - {min: 8, max: 9, result: "+1 EDU"}
          - {min: 10, max: 12, result: "gambler"}
    - name: "Service Skills"
      entries:
        num_dice: 2
        die_size: 6
        entries:
          - {min: 2, max: 2, result: "gunnery_turrets"}
          - {min: 3, max: 3, result: "mechanic"}
          - {min: 4, max: 5, result: "electronics_comms"}
          - {min: 6, max: 6, result: "electronics_sensors"}
          - {min: 7, max: 7, result: "pilot_small_craft"}
          - {min: 8, max: 9, result: "astrogation"}
          - {min: 10, max: 11, result: "sensor_ops"}
          - {min: 12, max: 12, result: "engineer"}
    - name: "Advanced Education"
      entries:
        num_dice: 2
        die_size: 6
        entries:
          - {min: 2, max: 3, result: "medic"}
          - {min: 4, max: 5, result: "leadership"}
          - {min: 6, max: 7, result: "tactics_naval"}
          - {min: 8, max: 9, result: "astrogation"}
          - {min: 10, max: 11, result: "engineer"}
          - {min: 12, max: 12, result: "computers"}
  ranks:
    - {rank: 1, title: "Ensign"}
    - {rank: 2, title: "Lieutenant"}
    - {rank: 3, title: "Lieutenant Commander"}
    - {rank: 4, title: "Commander"}
    - {rank: 5, title: "Captain"}
    - {rank: 6, title: "Admiral"}
  mustering_out_cash:
    name: "Cash Benefits"
    dm_per_term: 1
    dm_per_rank: 1
    entries:
      num_dice: 1
      die_size: 6
      entries:
        - {min: 1, max: 1, result: "5,000 Cr"}
        - {min: 2, max: 2, result: "10,000 Cr"}
        - {min: 3, max: 3, result: "20,000 Cr"}
        - {min: 4, max: 4, result: "30,000 Cr"}
        - {min: 5, max: 5, result: "40,000 Cr"}
        - {min: 6, max: 6, result: "50,000 Cr"}
  mustering_out_material:
    name: "Material Benefits"
    entries:
      num_dice: 1
      die_size: 6
      entries:
        - {min: 1, max: 1, result: "Weapon"}
        - {min: 2, max: 2, result: "Low Passage"}
        - {min: 3, max: 3, result: "Middle Passage"}
        - {min: 4, max: 4, result: "High Passage"}
        - {min: 5, max: 5, result: "Ship Share"}
        - {min: 6, max: 6, result: "TAS Membership"}

