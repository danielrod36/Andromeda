<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Andromeda — Lifepath</title>
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/vendor/htmx.min.js"></script>
</head>
<body data-theme="{{ theme }}">

  <!-- Status strip -->
  <header id="status-strip">
    <span class="status-char-ref">{{ character_name }}</span>
    <span class="status-mission">{{ character_career }}</span>
    <span class="status-credits">Terms: {{ character_terms }}</span>
    <span class="status-llm">{{ phase }}</span>
    <button id="drawer-toggle" class="status-link drawer-toggle"
            aria-expanded="{{ 'true' if drawer_pinned else 'false' }}"
            aria-controls="drawer"
            aria-label="Toggle character details drawer">
      Details
    </button>
    <div id="action-notice" aria-live="polite" role="status"></div>
  </header>

  <!-- Main row: spine + drawer -->
  <main id="main-row">
    <section id="spine" aria-live="polite">
      {% include "partials/lifepath_spine.html" %}
    </section>

    <!-- Drawer (pinned during assignment phases).  Client-managed (U5):
         never OOB-swapped — open state and loaded tab content survive
         every action.  The pin state travels on the OOB status strip. -->
    <aside id="drawer" data-drawer-pinned{% if not drawer_pinned %} hidden{% endif %}
           role="region" aria-label="Character details">
      <nav class="drawer-tabs" aria-label="Detail categories">
        <button data-tab="sheet" class="active">Sheet</button>
        <button data-tab="world">World</button>
        <button data-tab="audit">Audit</button>
      </nav>
      <div class="drawer-content">
        <p class="placeholder">Character sheet details arrive in a later unit.</p>
      </div>
      <button class="drawer-close" aria-label="Close drawer">✕</button>
    </aside>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
