<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Andromeda — Adventure</title>
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/vendor/htmx.min.js"></script>
</head>
<body data-theme="{{ theme }}">

  <!-- Status strip -->
  <header id="status-strip">
    <span class="status-char-ref">{{ character_name }}</span>
    <span class="status-mission">{{ character_career }}</span>
    <span class="status-credits">Terms: {{ character_terms }}</span>
    <span class="status-llm">{{ phase }}</span>
    <a href="/inspector/{{ save_name }}" class="status-link">Inspector</a>
    <button id="drawer-toggle" class="status-link drawer-toggle"
            aria-expanded="false" aria-controls="drawer"
            aria-label="Toggle character details drawer">
      Details
    </button>
    <div id="action-notice" aria-live="polite" role="status"></div>
  </header>

  <!-- Main row: spine + drawer -->
  <main id="main-row">
    <section id="spine" aria-live="polite">
      {% include "partials/adventure_spine.html" %}
    </section>

    <!-- Drawer: client-managed (U5).  Never OOB-swapped — open state and
         loaded tab content survive every action. -->
    <aside id="drawer" hidden
           role="region" aria-label="Character details">
      <nav class="drawer-tabs" aria-label="Detail categories">
        <button data-tab="sheet" class="active"
                hx-get="/sheet/{{ save_name }}"
                hx-target=".drawer-content"
                hx-swap="innerHTML">Sheet</button>
        <button data-tab="world"
                hx-get="/world/{{ save_name }}"
                hx-target=".drawer-content"
                hx-swap="innerHTML">World</button>
        <button data-tab="audit"
                hx-get="/audit/{{ save_name }}"
                hx-target=".drawer-content"
                hx-swap="innerHTML">Audit</button>
      </nav>
      <div class="drawer-content">
        {% include "partials/sheet.html" %}
      </div>
      <button class="drawer-close" aria-label="Close drawer">✕</button>
    </aside>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
