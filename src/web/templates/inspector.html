<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Andromeda — Inspector</title>
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body data-theme="{{ theme }}">
  <main id="spine">
    <h1>Curated View Inspector</h1>
    <p class="inspector-intro">
      This is exactly what the LLM sees — the safe subset of game state.
      No raw dice, no RNG, no audit log internals.
    </p>

    {% if guard_error %}
    <div class="inspector-error">
      <strong>AE13 Violation:</strong> {{ guard_error }}
    </div>
    {% else %}
    <pre class="inspector-json">{{ view_json }}</pre>
    {% endif %}

    <p><a href="/adventure/{{ save_name }}">Back to adventure</a></p>
    <p><a href="/menu">Main menu</a></p>
  </main>
</body>
</html>
