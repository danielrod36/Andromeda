{# Story-so-far recap shown on resume (U11, R13). #}
{% if recap and recap.lines %}
<div class="recap" role="region" aria-label="Story so far">
  <details{% if source == "llm" %} open{% endif %}>
    <summary>📖 Story so far</summary>
    <div class="recap-body">
      {% for line in recap.lines %}
      <p class="recap-line">{{ line }}</p>
      {% endfor %}
    </div>
  </details>
</div>
{% endif %}
